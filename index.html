<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda de Ropa - Estilo Temu</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK de PayPal para pagos reales/sandbox -->
  <script src="BAAg13fSLpDd6P64mGKmp5_NBdGm23H9HLD39Q23DM6nUJpNomTyIvfw0yHsiz2Qt83gkccMYNHOsOy4v0&currency=USD"></script>
</head>
<body>

  <!-- Encabezado con buscador y carrito -->
  <header class="header">
    <div class="logo">MODA<span>EXPRESS</span></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar ropa, calzado, accesorios...">
      <button>Buscar</button>
    </div>
    <div class="cart-icon" id="cartBtn">
      🛒 <span id="cartCount">0</span>
    </div>
  </header>

  <!-- Banner promocional -->
  <section class="banner">
    <h2>🔥 ¡Ofertas Relámpago hasta 70% OFF! 🔥</h2>
    <p>Envío gratis en tu primera compra</p>
  </section>

  <!-- Contenedor del Catálogo de Productos -->
  <main class="container">
    <h2>Novedades y Tendencias</h2>
    <div class="product-grid" id="productGrid">
      <!-- Los productos se cargarán dinámicamente desde app.js -->
    </div>
  </main>

  <!-- Modal / Ventana flotante del Carrito -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <span class="close-btn" id="closeCart">&times;</span>
      <h2>Tu Carrito de Compras</h2>
      <div id="cartItems">
        <p>El carrito está vacío.</p>
      </div>
      <div class="cart-summary">
        <h3>Total: $<span id="cartTotal">0.00</span></h3>
        <div id="paypal-button-container" style="margin-top: 15px;"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
